<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Player</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            display: flex;
            justify-content: center;

            height: 100vh;
        }
        .video-container {
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border-radius: 8px;
            overflow: hidden;
            background: #000;
        }
    </style>
</head>
<body>

    <div class="video-container">
        <iframe width="640" height="360" src="http://localhost/player.html?v=RHSDSd_BG" frameborder="0" scrolling="0" allowfullscreen></iframe>
    </div>

</body>
</html>
