<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeStream</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>AnimeStream</h1>
</header>

<section class="hero">
    <div class="overlay">
        <h2>Jujutsu Kaisen 0</h2>

        <p>
            Watch the movie in HD directly from your browser.
        </p>

        <button id="watchBtn">
            Watch Now
        </button>
    </div>
</section>

<section id="playerSection" class="hidden">

    <h2>Now Playing</h2>

    <div class="player">

        <iframe
            id="animePlayer"
            src=""
            allowfullscreen
            frameborder="0">
        </iframe>

    </div>

</section>

<footer>
    © 2026 AnimeStream
</footer>

<script src="script.js"></script>

</body>
</html>
